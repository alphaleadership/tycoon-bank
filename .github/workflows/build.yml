name: Build Electron App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create v$VERSION --title "Tycoon Bank v$VERSION" --notes "🚀 Déploiement automatique de la version $VERSION.
          
          **Quoi de neuf ?**
          - Dernières modifications et ajouts de fonctionnalités.
          - Amélioration de la rentabilité et de la Bourse.
          
          *L'auto-updater téléchargera automatiquement cette version au prochain lancement du jeu.*" || echo "Release already exists"

      - name: Build & Publish App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always
